<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reusable Studio Engine</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="stage">
      <p class="status" id="status">50%</p>
      <canvas id="studio-canvas" aria-label="Interactive signal sketch"></canvas>
      <section class="notes" aria-labelledby="notes-title">
        <p class="eyebrow">A small signal study</p>
        <h1 id="notes-title">Move across the field.</h1>
        <p>The percentage tracks your horizontal pointer position. As it rises, the orange ring grows, gains weight, and pulses faster.</p>
      </section>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
